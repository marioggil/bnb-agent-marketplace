name: bnb-agent-marketplace

# ---------------------------------------------------------------------------
# Stack for bnb-agent-marketplace (Dokploy + local dev).
#
# Env var strategy:
#   Dokploy's compose parser does NOT support `${VAR}` interpolation in
#   the environment block. We therefore:
#   * Inline safe defaults as literal strings (e.g. 8004SCAN_BASE).
#   * Leave the per-deploy secrets and connection strings OUT of this
#     file entirely. They are set in the Dokploy panel (or in a host
#     .env passed via `docker compose --env-file .env`) and injected
#     directly into the container as environment variables.
#
# Required env vars to set in the Dokploy panel (case-sensitive names):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#     (Postgres refuses to start with empty values, so missing entries
#     there are loud.)
#   DATABASE_URL = postgresql+asyncpg://<user>:<password>@db:5432/<db>
#   SECRET_KEY    = 32+ random bytes (Settings validator rejects weak
#                   values; see app/config.py)
#   8004SCAN_API_KEY (optional, leave unset for the free ~50 rpm tier)
#
# Optional env vars with sane defaults below (override in the panel):
#   SESSION_TTL_MIN, LOG_LEVEL, WORKER_RATE_PER_SEC
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    container_name: bnb-agent-db
    restart: unless-stopped
    # Inline env vars for the Postgres image. Dokploy v0.29.14 with a
    # GitHub provider does NOT inject panel env-vars into the runtime
    # container for compose services (verified 2026-08-08: panel values
    # were saved but the Converted Compose showed an empty `environment:`
    # block, and the app container's preflight crashed with
    # `FATAL: DATABASE_URL is not set` every restart). The literals below
    # are required to make the stack bootable. Rotate after deploy.
    environment:
      POSTGRES_USER: bnb
      POSTGRES_PASSWORD: CVc9et1hDP3PYwRILMFiZkXE
      POSTGRES_DB: bnb_agent
    # Note: when changing POSTGRES_PASSWORD you must `docker volume rm
    # bnb-agent-pgdata` once so initdb re-runs with the new credentials.
    # The `db` container will not accept a password change otherwise.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U bnb -d bnb_agent"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bnb-agent-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 8004scan base URL is safe to inline. The API key is optional and
      # is set in the Dokploy panel (or left unset for the free tier).
      8004SCAN_BASE: https://8004scan.io/api/v1/public

      # Operational defaults — literal values, override in the panel.
      SESSION_TTL_MIN: "60"
      LOG_LEVEL: INFO
      WORKER_RATE_PER_SEC: "4"

      # Secrets inlined for the same reason as the `db` service above:
      # Dokploy's panel env-vars are not reaching this container, so the
      # preflight (DATABASE_URL / SECRET_KEY) and the Postgres auth
      # (POSTGRES_*) must come from the compose file. Accept the repo-
      # hygiene trade-off for the MVP alpha and rotate after deploy.
      POSTGRES_USER: bnb
      POSTGRES_PASSWORD: CVc9et1hDP3PYwRILMFiZkXE
      POSTGRES_DB: bnb_agent
      DATABASE_URL: postgresql+asyncpg://bnb:CVc9et1hDP3PYwRILMFiZkXE@db:5432/bnb_agent
      SECRET_KEY: BWe6k5vSV47iRy4FyXvzkgwdav4apdTeaiJpTJOnqxY
    ports:
      - "8000:8000"
    # Preflight + alembic + uvicorn. The preflight block makes any missing
    # required env var fail with a clear message instead of a SQLAlchemy
    # traceback. DATABASE_URL and SECRET_KEY are required (Dokploy must
    # set them in the panel); without them the container exits 1.
    command:
      - "sh"
      - "./entrypoint.sh"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
    # The previous name (bnb-agent-pgdata) was created on the very first
    # deploy with a Postgres password that no longer matches the one in
    # this compose. Postgres only re-runs initdb on an empty volume, so
    # rotating the password requires creating a new named volume. The old
    # `bnb-agent-pgdata` can be removed manually once we confirm the new
    # stack is healthy.
    name: bnb-agent-pgdata-v2
