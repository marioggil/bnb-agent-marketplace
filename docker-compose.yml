name: bnb-agent-marketplace

# ---------------------------------------------------------------------------
# Stack for bnb-agent-marketplace (Dokploy + local dev).
#
# Env var strategy (Dokploy):
#   Dokploy writes the panel Environment tab to a `.env` file next to this
#   compose file and does NOT inject those vars into containers automatically
#   (docs.dokploy.com/docs/core/docker-compose -> Environment). We therefore
#   load that file explicitly with `env_file: [".env"]` on every service.
#
#   Secrets (POSTGRES_USER/PASSWORD/DB, DATABASE_URL, SECRET_KEY,
#   SYNC_API_KEY, X402_FACILITATOR_KEY) are set ONLY in the Dokploy panel and
#   are NEVER committed here. Keep only non-secret defaults in the
#   `environment:` block — a key present there wins over the panel value.
#
# Required env vars to set in the Dokploy panel (case-sensitive names):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#     (Postgres refuses to start with empty values, so missing entries
#     there are loud.)
#   DATABASE_URL = postgresql+asyncpg://<user>:<password>@db:5432/<db>
#   SECRET_KEY    = 32+ random bytes (Settings validator rejects weak
#                   values; see app/config.py)
#   8004SCAN_API_KEY (optional, leave unset for the free ~50 rpm tier)
#
# Optional env vars (override in the panel):
#   SESSION_TTL_MIN, LOG_LEVEL, WORKER_RATE_PER_SEC
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    container_name: bnb-agent-db
    restart: unless-stopped
    # Postgres credentials come from the Dokploy panel via `env_file: .env`
    # (Dokploy writes the panel to `.env` next to this file; it is NOT
    # injected automatically — see header). Keys: POSTGRES_USER,
    # POSTGRES_PASSWORD, POSTGRES_DB.
    env_file:
      - .env
    # Note: when changing POSTGRES_PASSWORD you must bump the `pgdata`
    # volume name (below) so initdb re-runs with the new credentials. The
    # `db` container will not accept a password change otherwise.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U bnb -d bnb_agent"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bnb-agent-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Secrets (DATABASE_URL, SECRET_KEY, SYNC_API_KEY, X402_FACILITATOR_KEY,
    # POSTGRES_*) come from the Dokploy panel via `env_file: .env`. The panel
    # writes them to `.env` next to this compose file; we load that file into
    # the container because Dokploy does NOT inject panel env vars
    # automatically. Never commit secrets here.
    env_file:
      - .env
    environment:
      # Non-secret defaults (literal values). A key set here WINS over the
      # panel value for the same key — remove a key from this block if you
      # want the panel to control it.
      8004SCAN_BASE: https://8004scan.io/api/v1/public
      SESSION_TTL_MIN: "60"
      LOG_LEVEL: INFO
      WORKER_RATE_PER_SEC: "4"
      # Production settles on BSC MAINNET (chain 56). The panel can no
      # longer override these — remove the keys from this block to let the
      # panel control them (e.g. for a testnet mirror deployment).
      X402_CHAIN_ID: "56"
      X402_RPC_URL: https://bsc-rpc.publicnode.com
    ports:
      - "8000:8000"
    # Preflight + alembic + uvicorn. The preflight block makes any missing
    # required env var fail with a clear message instead of a SQLAlchemy
    # traceback. DATABASE_URL and SECRET_KEY are required (Dokploy must
    # set them in the panel); without them the container exits 1.
    command:
      - "sh"
      - "./entrypoint.sh"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
    # Each attempt to apply the 0001_initial migration against a fresh
    # volume surfaced a different issue (v1: stale password from the
    # panel era; v2: GENERATED column with subquery rejected by
    # Postgres). v3 was the working app + migration. Bumped to v4 on
    # 2026-08-25 to rotate POSTGRES_PASSWORD (initdb must re-run with the
    # new credentials). v4 was then initdb'd with the stale password
    # (created before the panel update landed), so bumped to v5 to align
    # with the rotated password in the panel. Bump this every time we need
    # initdb to run again from scratch.
    name: bnb-agent-pgdata-v5
