name: bnb-agent-marketplace

# ---------------------------------------------------------------------------
# Local dev + Dokploy stack for bnb-agent-marketplace.
#
# - `db`  is a Postgres 16 instance with a named volume (`pgdata`) and the
#   official `pg_isready` healthcheck.
# - `app` waits for `db` to be healthy, then runs `alembic upgrade head`
#   before launching uvicorn. The healthcheck probes the FastAPI `/healthz`
#   endpoint.
#
# Bootstrap (from the repo root):
#   docker compose up --build
#
# Env var injection strategy (important):
#   Dokploy's compose parser rejects the standard Compose interpolation
#   form `${VAR:-default}` for any default (not only the empty-literal
#   `${VAR:-}` reported in build logs). Every env var in this file is
#   therefore either:
#     * a literal default (safe values only — e.g. `LOG_LEVEL=INFO`),
#     * or a bare `${VAR}` reference, which is set in the Dokploy panel
#       and falls back to the empty string when unset (the app's Settings
#       raises a clear validation error for missing secrets).
#   Do not reintroduce `${VAR:-default}` here.
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    container_name: bnb-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bnb-agent-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # All values must be set in the Dokploy panel (or the host's .env when
      # running locally with `docker compose --env-file .env`). No default
      # fallbacks in this file because Dokploy's parser rejects the form.
      DATABASE_URL: ${DATABASE_URL}
      8004SCAN_BASE: ${8004SCAN_BASE}
      8004SCAN_API_KEY: ${8004SCAN_API_KEY}
      SECRET_KEY: ${SECRET_KEY}
      SESSION_TTL_MIN: ${SESSION_TTL_MIN}
      LOG_LEVEL: ${LOG_LEVEL}
      WORKER_RATE_PER_SEC: ${WORKER_RATE_PER_SEC}
    ports:
      - "8000:8000"
    command:
      - "sh"
      - "-c"
      - "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
    name: bnb-agent-pgdata
