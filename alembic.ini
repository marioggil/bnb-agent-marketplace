# Alembic config for bnb_agent. See migrations/env.py for the runtime swap to
# psycopg2 (design D9). The DATABASE_URL is read from the environment by
# env.py directly, so it is intentionally NOT set here.

[alembic]
# Path to the migration scripts (relative to this file).
script_location = migrations

# Template used to generate migration files. Default keeps it minimal — we
# hand-author 0001_initial because of the GENERATED column and the partial
# indexes.
file_template = %%(rev)s_%%(slug)s

# Timezone for `create_date` revision metadata.
timezone = UTC

# Max identifier length (Postgres default).
truncate_slug_length = 40

# Set in env.py via `alembic.context.config.set_main_option` when running
# under `alembic upgrade head`; the same DATABASE_URL is rewritten from
# `postgresql+asyncpg://` (runtime) to `postgresql+psycopg2://` (Alembic).
sqlalchemy.url =

# Migration revision metadata table.
version_table = alembic_version

[post_write_hooks]
# Reserved for future hooks; intentionally empty.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
