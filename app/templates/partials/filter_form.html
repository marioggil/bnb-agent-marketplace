{# Server-rendered filter form. GET submits are no-JS friendly; the same
   form is HTMX-boostable in a follow-up change. One row that wraps on
   mobile (DESIGN.md filters); category options show display names via the
   `category_label` filter. #}
<form method="get" action="/" class="filter-form">
  {% if owner %}<input type="hidden" name="owner" value="{{ owner }}" />{% endif %}
  <input type="text" name="q" value="{{ q or '' }}" placeholder="Search agents" aria-label="Search" />
  <select name="category" aria-label="Category">
    <option value="">All</option>
    {% for c in ['rebalancing', 'grid_trading', 'yield_optimisation', 'health_factor_monitoring', 'other'] %}
      <option value="{{ c }}" {% if c == category %}selected{% endif %}>{{ c | category_label }}</option>
    {% endfor %}
  </select>
  <select name="platform" aria-label="Platform">
    <option value="">All platforms</option>
    {% for p in ['evoevo', 'termix', 'other'] %}
      <option value="{{ p }}" {% if p == platform %}selected{% endif %}>{{ p | capitalize }}</option>
    {% endfor %}
  </select>
  <select name="hireable" aria-label="Payment">
    <option value="">All payments</option>
    <option value="true" {% if hireable == 'true' or hireable is sameas true %}selected{% endif %}>Hireable (x402)</option>
    <option value="false" {% if hireable == 'false' or hireable is sameas false %}selected{% endif %}>Not hireable</option>
  </select>
  <select name="health" aria-label="Endpoint health">
    <option value="">All health</option>
    {% for h in ['degraded', 'unhealthy', 'unknown', 'not_measured'] %}
      <option value="{{ h }}" {% if h == health %}selected{% endif %}>{{ h | replace('_', ' ') | capitalize }}</option>
    {% endfor %}
  </select>
  <label class="check"><input type="checkbox" name="x402" value="true"
         title="Payable via x402 — pay per request" {% if x402 %}checked{% endif %} /> x402 only</label>
  <select name="sort" aria-label="Sort">
    {% set _sort_labels = {'average_score': 'Top rated', 'total_feedbacks': 'Most rated', 'created_at': 'Newest', 'name': 'Name', 'metadata_completeness': 'Metadata completeness', 'health_score': 'Endpoint health'} %}
    {% for s in ['average_score', 'total_feedbacks', 'created_at', 'name', 'metadata_completeness', 'health_score'] %}
      <option value="{{ s }}" {% if s == sort %}selected{% endif %}>{{ _sort_labels.get(s, s) }}</option>
    {% endfor %}
  </select>
  <button type="submit" class="btn btn-primary">Apply</button>
</form>
