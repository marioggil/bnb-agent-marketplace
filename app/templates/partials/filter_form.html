{# Server-rendered filter form. GET submits are no-JS friendly; the same
   form is HTMX-boostable in a follow-up change. #}
<form method="get" action="/">
  <label>Search <input type="text" name="q" value="{{ q or '' }}" /></label>
  <label>Category
    <select name="category">
      <option value="">all</option>
      {% for c in ['rebalancing', 'grid_trading', 'yield_optimisation', 'health_factor_monitoring', 'other'] %}
        <option value="{{ c }}" {% if c == category %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>
  </label>
  <label><input type="checkbox" name="x402" value="true" {% if x402 %}checked{% endif %} /> x402 only</label>
  <label>Sort
    <select name="sort">
      {% for s in ['average_score', 'total_feedbacks', 'created_at', 'name'] %}
        <option value="{{ s }}" {% if s == sort %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">Apply</button>
</form>
